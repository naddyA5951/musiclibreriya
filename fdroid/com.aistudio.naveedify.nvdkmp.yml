AutoName: Naveedify
Summary: Spotify-style music streaming and library player
Description: |-
  Naveedify is an open-source Spotify-inspired music streaming application
  crafted with Jetpack Compose, Material 3, and Room local persistence.

  Features include:
  * Persistent bottom navigation bar with integrated playback controls
  * Curated playlists and mixes personalized for Naveed
  * Dynamic soundwave visualizer and full-screen Now Playing mode
  * Offline-capable Room database for custom playlists and liked tracks
  * Zero trackers and 100% Free and Open Source (FOSS)

